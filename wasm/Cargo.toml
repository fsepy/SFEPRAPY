[package]
name = "sfeprapy-wasm"
version = "0.1.0"
edition = "2021"
description = "Rust → WASM port of sfeprapy's equivalent-time-exposure calculation"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
