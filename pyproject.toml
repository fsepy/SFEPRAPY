[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfeprapy"
description = "Structural Fire Engineering - Probabilistic Reliability Assessment (Equivalent Time Exposure)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Ian Fu", email = "fuyans@gmail.com"}]
keywords = ["fire safety", "structural fire engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.17.1",
    "scipy>=1.6.0",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
fast = ["numba>=0.55"]  # ~27x speedup on the steel-temperature solver; optional, falls back to pure Python

[project.urls]
Homepage = "https://github.com/fsepy/sfeprapy"

# Read the version from src/sfeprapy/_version.py at build time (parsed, not imported),
# so the build does not need the package on sys.path.
[tool.setuptools.dynamic]
version = {attr = "sfeprapy._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
